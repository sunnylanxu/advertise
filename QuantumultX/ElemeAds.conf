# Quantumult X - 饿了么开屏广告拦截规则
# 将本文件内容合并到主配置文件对应的 [rewrite_local] 和 [mitm] 区段。
# 如果主配置中已经存在这些区段，请把规则追加进去，不要重复创建同名区段。
# 如果已有 hostname 列表，请将下面域名追加到原列表，不要覆盖原有 hostname。

[rewrite_local]

# o2oad 视频素材
^https:\/\/o2oad\.elemecdn\.com\/video_edit_3s_11\/.* url reject

# 饿了么开屏广告

# nr-op / cube 开屏图片
^https:\/\/(nr-op|cube)\.elemecdn\.com\/.+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{4,},h_\d{4,}\/($|format,webp\/$) url reject

# cube 开屏图片
^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_1\d{3},h_2\d{3}\/format,webp\/ url reject

^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_6\d{2},h_8\d{2}\/format,webp\/ url reject

^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{3},h_\d{4}\/format,webp\/ url reject

# cube 开屏视频
^https?:\/\/cube\.elemecdn\.com\/\w\/\w{2}\/\w+mp4\.mp4\? url reject

# fuss10 开屏图片
^https?:\/\/fuss10\.elemecdn\.com\/.+\/w\/640\/h\/\d{3,4} url reject

^https?:\/\/fuss10\.elemecdn\.com\/.+\/w\/750\/h\/\d{3,4} url reject

# sitemap
^https?:\/\/elemecdn\.com\/.+\/sitemap url reject


[mitm]
hostname = %APPEND% o2oad.elemecdn.com, nr-op.elemecdn.com, cube.elemecdn.com, fuss10.elemecdn.com, elemecdn.com